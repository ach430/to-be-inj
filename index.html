<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今天你觉醒了吗</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f6f2ea;
      color: #222;
    }

    .page {
      width: min(92vw, 680px);
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #eadfce;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: #8a6a3f;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    #question {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line;
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 700;
      line-height: 1.35;
    }

    #options {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 30px;
      font-size: 18px;
      cursor: pointer;
      background: #f3d7a6;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      background: #edc986;
    }

    .secondary {
      background: #eeeeee;
      font-size: 15px;
      padding: 10px 18px;
    }

    .secondary:hover {
      background: #e0e0e0;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    .path {
      margin-top: 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">今天你觉醒了吗</div>
      <div id="question"></div>
      <div id="options"></div>
      <div class="toolbar">
        <button class="secondary" id="backBtn">上一步</button>
        <button class="secondary" id="restartBtn">重新开始</button>
      </div>
      <div class="path" id="path"></div>
    </section>
  </main>

  <script>
    // 核心：把每一个框写成一个节点。
    // text 是这一页显示的问题或结果；options 是按钮；next 指向下一个节点的 id。
    const FLOW = {
      start: {
        text: "你是女性吗？",
        options: [
          { label: "是", next: "straight" },
          { label: "不是", next: "maleEnd" }
        ]
      },

      maleEnd: {
        text: "臭公狗路边一条",
        options: []
      },

      straight: {
        text: "你是直女吗？",
        options: [
          { label: "是", next: "love" },
          { label: "不是", next: "important" }
        ]
      },

      love: {
        text: "谈过恋爱吗？",
        options: [
          { label: "是", next: "endA" },
          { label: "否", next: "endB" }
        ]
      },

      important: {
        text: "这重要吗？",
        options: [
          { label: "是", next: "likeFemaleCharacter" },
          { label: "否", next: "endB" }
        ]
      },

      likeFemaleCharacter: {
        text: "你喜欢女角色吗？",
        options: [
          { label: "是", next: "ironT" },
          { label: "否", next: "endB" }
        ]
      },

      ironT: {
        text: "这个角色的风格是铁T吗？",
        options: [
          { label: "是", next: "bg" },
          { label: "否", next: "endWeak" }
        ]
      },

      bg: {
        text: "磕她的 BG CP / CB 吗？",
        options: [
          { label: "是", next: "endSkin" },
          { label: "否", next: "gb" }
        ]
      },

      gb: {
        text: "磕她的 GB CP / CB 吗？",
        options: [
          { label: "是", next: "endC" },
          { label: "否", next: "gl" }
        ]
      },

      gl: {
        text: "磕她的 GL CP / CB 吗？",
        options: [
          { label: "是", next: "endD" },
          { label: "否", next: "femaleFeature" }
        ]
      },

      femaleFeature: {
        text: "你喜欢她的女性生理特征吗？",
        options: [
          { label: "是", next: "endFreedom" },
          { label: "否", next: "endCongrats" }
        ]
      },

      endA: {
        text: "这里写图中左下角的结果文案",
        options: []
      },

      endB: {
        text: "爱男解",
        options: []
      },

      endWeak: {
        text: "弱化女性",
        options: [
          { label: "继续", next: "endSkin" }
        ]
      },

      endSkin: {
        text: "当皮套穿走了",
        options: []
      },

      endC: {
        text: "男嬷",
        options: []
      },

      endD: {
        text: "这里写图中右侧长方框的结果文案",
        options: [
          { label: "继续", next: "endSkin" }
        ]
      },

      endFreedom: {
        text: "向下的自由不是自由！",
        options: []
      },

      endCongrats: {
        text: "恭喜！\n这里写最终结果文案。",
        options: []
      }
    };

    let currentId = "start";
    const historyStack = [];
    const answerPath = [];

    const questionEl = document.querySelector("#question");
    const optionsEl = document.querySelector("#options");
    const pathEl = document.querySelector("#path");
    const backBtn = document.querySelector("#backBtn");
    const restartBtn = document.querySelector("#restartBtn");

    function render() {
      const node = FLOW[currentId];
      questionEl.textContent = node.text;
      optionsEl.innerHTML = "";

      node.options.forEach((option) => {
        const btn = document.createElement("button");
        btn.textContent = option.label;
        btn.addEventListener("click", () => choose(option));
        optionsEl.appendChild(btn);
      });

      if (node.options.length === 0) {
        const btn = document.createElement("button");
        btn.textContent = "再玩一次";
        btn.addEventListener("click", restart);
        optionsEl.appendChild(btn);
      }

      backBtn.disabled = historyStack.length === 0;
      pathEl.textContent = answerPath.length ? `你的选择路径：${answerPath.join(" → ")}` : "";
    }

    function choose(option) {
      historyStack.push(currentId);
      answerPath.push(option.label);
      currentId = option.next;
      render();
    }

    function goBack() {
      if (historyStack.length === 0) return;
      currentId = historyStack.pop();
      answerPath.pop();
      render();
    }

    function restart() {
      currentId = "start";
      historyStack.length = 0;
      answerPath.length = 0;
      render();
    }

    backBtn.addEventListener("click", goBack);
    restartBtn.addEventListener("click", restart);

    render();
  </script>
</body>
</html>
